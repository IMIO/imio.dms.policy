[buildout]
always-checkout = force
# imio.dms.mail master is the Plone 4.3 code: its dependencies are the releases pinned in versions-4.3.cfg
auto-checkout +=
    collective.portlet.actions
    collective.relationhelpers
    imio.dms.mail
    imio.transmogrifier.contact
    imio.transmogrifier.iadocs

[remotes]
imio = https://github.com/imio
imio_push = git@github.com:imio
plone = https://github.com/plone
plone_push = git@github.com:plone
collective = https://github.com/collective
collective_push = git@github.com:collective

sge = https://github.com/sgeulette
sge_push = git@github.com:sgeulette

[sources]
# Plone 4.3 code: same sources as server.dmsmail (no Plone 4 release on PyPI)
collective.portlet.actions = git ${remotes:sge}/collective.portlet.actions.git pushurl=${remotes:sge_push}/collective.portlet.actions.git
collective.relationhelpers = git ${remotes:imio}/collective.relationhelpers.git pushurl=${remotes:imio_push}/collective.relationhelpers.git branch=plone4
imio.dms.mail = git ${remotes:imio}/imio.dms.mail.git pushurl=${remotes:imio_push}/imio.dms.mail.git branch=master
imio.transmogrifier.contact = git ${remotes:imio}/imio.transmogrifier.contact.git pushurl=${remotes:imio_push}/imio.transmogrifier.contact.git branch=master
imio.transmogrifier.iadocs = git ${remotes:imio}/imio.transmogrifier.iadocs.git pushurl=${remotes:imio_push}/imio.transmogrifier.iadocs.git branch=master
